name: Tag merged release

# Ordinary merges never release. Only the reviewed branch produced by
# scripts/release.mjs is eligible, and only after GitHub reports it merged.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: tag-merged-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag reviewed release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      # Enforce this again at publication time even though the branch rules also
      # require it. A future ruleset mistake must not turn an admin merge into an
      # unreviewed release.
      - name: Require a current non-author maintainer approval
        uses: actions/github-script@v7
        with:
          script: |
            const fs = await import('node:fs');
            const policy = await import(`${process.env.GITHUB_WORKSPACE}/scripts/governance-check.mjs`);
            const maintainers = policy.parseMaintainers(fs.readFileSync('MAINTAINERS.md', 'utf8'));
            const pull = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: pull.number,
            });
            const approvals = policy.currentApprovers({
              reviews,
              trustedMaintainers: new Set(maintainers.keys()),
              author: pull.user.login,
              headSha: pull.head.sha,
            });
            if (approvals.length < 1) {
              core.setFailed('release PR needs a current approval from a non-author maintainer');
            } else {
              core.info(`Release approved by: ${approvals.join(', ')}`);
            }

      - id: version
        name: Read the version from the release branch
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^release/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::invalid release branch: $RELEASE_BRANCH"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - name: The merged tree is a complete prepared release
        run: node scripts/verify-prepared-release.mjs "${{ steps.version.outputs.version }}"

      - name: This is the next release on the declared line
        run: |
          expected=$(node scripts/next-version.mjs)
          if [ "$expected" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::release branch says ${{ steps.version.outputs.version }}, but the next version is $expected"
            exit 1
          fi

      # A rerun after the tag was pushed but before dispatch is safe: accept the
      # existing tag only when it resolves to this exact reviewed merge commit.
      - name: Create the annotated tag if needed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$MERGE_SHA" ]; then
              echo "::error::$tag already points to $tagged, not $MERGE_SHA"
              exit 1
            fi
            echo "$tag already points to the reviewed merge commit"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" "$MERGE_SHA" -m "$tag"
            git push origin "$tag"
          fi

      # A tag pushed with GITHUB_TOKEN does not emit another workflow run.
      # workflow_dispatch is GitHub's explicit recursion-safe exception.
      - name: Start release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${{ steps.version.outputs.version }}"
