name: Release

# Tag-driven. A merged release/vX.Y.Z PR creates its tag through
# tag-merged-release.yml; a manually pushed recovery tag still works. Ordinary
# merges never enter this workflow and only update edge.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release

jobs:
  verify:
    name: Verify the tag matches the tree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publishing configuration is present
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          for name in DOCKERHUB_IMAGE DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release publishing is not configured: missing ${missing[*]}"
            exit 1
          fi

      - name: The tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::release tag is not reachable from main"; exit 1; }

      # A tag whose tree says a different version would publish images labelled
      # with one number and reporting another. Fail before anything is pushed.
      - name: Prepared release agrees with the tag
        run: node scripts/verify-prepared-release.mjs "${{ steps.v.outputs.version }}"

      - run: node scripts/validate-template.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck && npm test
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend

  publish:
    name: Publish image
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          # Full version plus the moving major/minor lines, so a user can pin as
          # loosely or as tightly as they want. `latest` moves here and nowhere else.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section
        run: |
          # Stop at the next version heading, or at the link definitions that
          # close the file — the last release would otherwise carry them along.
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## \\["v"\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "**Unraid:** update the container to pick this up (the template tracks \`latest\`)."
            echo "To pin or roll back, set the repository to \`${{ vars.DOCKERHUB_IMAGE }}:${{ needs.verify.outputs.version }}\`."
          } >> release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          name: v${{ needs.verify.outputs.version }}
